<style>
  :root{
    --black:#121318; --navy:#3B4A86; --blue:#5A6DB0; --gold:#C8962B;
    --ink:#1A1C24; --red:#D63A2A; --muted:#6E7180;
    --green:#1A7F37; --amber:#9A6700; --line:#E6E6EA;
    --bg:#FAFAFB; --card:#FFFFFF; --text:#1A1C24; --sub:#6E7180;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#121318; --card:#1C1E26; --text:#ECEDF2; --sub:#A6A9B5; --line:#2A2D38; --green:#4BD16B; --amber:#E7B84B; }
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  html,body{ margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    font-size:17px; line-height:1.4; }
  .wrap{ max-width:620px; margin:0 auto; padding:0 16px 40px;
    padding-left:max(16px,env(safe-area-inset-left)); padding-right:max(16px,env(safe-area-inset-right)); }
  header{ background:var(--black); color:#fff; padding:env(safe-area-inset-top) 0 0; border-bottom:3px solid var(--gold); }
  .hbar{ max-width:620px; margin:0 auto; padding:14px 16px 16px; display:flex; align-items:center; gap:12px; }
  .hbar img{ width:46px; height:46px; flex:none; border-radius:9px; }
  .hbar h1{ font-size:20px; margin:0; font-weight:700; letter-spacing:.2px; }
  .hbar p{ margin:2px 0 0; font-size:13px; color:#D6D4E8; }
  /* status banner */
  #status{ position:sticky; top:0; z-index:5; padding:10px 16px; font-size:14px; font-weight:600;
    display:flex; align-items:center; gap:9px; }
  #status .dot{ width:11px; height:11px; border-radius:50%; flex:none; }
  .s-ok{ background:#E8F6EC; color:var(--green); } .s-ok .dot{ background:#50E040; }
  .s-wait{ background:#FBF3DF; color:var(--amber); } .s-wait .dot{ background:#E7B84B; }
  .s-off{ background:#EDEAE4; color:var(--muted); } .s-off .dot{ background:#9aa; }
  @media (prefers-color-scheme: dark){ .s-ok{background:#16301d}.s-wait{background:#332b12}.s-off{background:#22202f} }
  h2{ font-size:16px; color:var(--navy); margin:22px 0 8px; border-bottom:2px solid var(--navy); padding-bottom:5px; }
  @media (prefers-color-scheme: dark){ h2{ color:#9FB0E8; border-color:#3a4a80; } }
  label.fld{ display:block; font-size:13px; color:var(--sub); margin:12px 0 4px; font-weight:600; }
  input[type=text], select, textarea{ width:100%; padding:12px; font-size:17px; border:1px solid var(--line);
    border-radius:10px; background:var(--card); color:var(--text); font-family:inherit; }
  textarea{ min-height:70px; resize:vertical; }
  .req::after{ content:" *"; color:var(--red); }
  /* check rows */
  .chk{ display:flex; align-items:center; gap:12px; padding:12px 6px; min-height:52px;
    border-bottom:1px solid var(--line); cursor:pointer; user-select:none; }
  .chk:last-child{ border-bottom:0; }
  .box{ width:26px; height:26px; border:2px solid var(--navy); border-radius:6px; flex:none;
    display:flex; align-items:center; justify-content:center; background:var(--card); }
  .chk.on .box{ background:var(--navy); }
  .box svg{ display:none; } .chk.on .box svg{ display:block; }
  .chk .lbl{ flex:1; } .chk .note{ color:var(--sub); font-size:13px; }
  /* declaration */
  .decl{ display:flex; gap:10px; align-items:flex-start; padding:14px; border:1.5px solid var(--line);
    border-radius:12px; margin-top:8px; cursor:pointer; background:var(--card); }
  .decl.sel{ border-color:var(--navy); }
  .decl.sel.warn{ border-color:var(--red); }
  .decl .r{ width:22px; height:22px; border-radius:50%; border:2px solid var(--muted); flex:none; margin-top:1px; }
  .decl.sel .r{ border-color:var(--navy); background:radial-gradient(var(--navy) 40%, transparent 46%); }
  .decl.sel.warn .r{ border-color:var(--red); background:radial-gradient(var(--red) 40%, transparent 46%); }
  button{ font-family:inherit; }
  .primary{ width:100%; margin-top:20px; padding:16px; font-size:18px; font-weight:700; color:#fff;
    background:var(--navy); border:0; border-radius:12px; }
  .primary:active{ opacity:.9; }
  .ghost{ background:transparent; border:1px solid var(--line); color:var(--text); border-radius:10px; padding:9px 14px; font-size:14px; }
  .warnline{ color:var(--red); font-weight:700; font-size:14px; margin-top:14px; }
  .recent{ margin-top:10px; }
  .rec{ display:flex; align-items:center; gap:10px; padding:10px 4px; border-bottom:1px solid var(--line); font-size:14px; }
  .rec .who{ flex:1; } .rec .when{ color:var(--sub); font-size:12px; }
  .chip{ font-size:12px; font-weight:700; padding:3px 9px; border-radius:20px; white-space:nowrap; }
  .chip.sy{ background:#E8F6EC; color:var(--green); } .chip.pe{ background:#FBF3DF; color:var(--amber); }
  @media (prefers-color-scheme: dark){ .chip.sy{background:#16301d}.chip.pe{background:#332b12} }
  .devrow{ display:flex; justify-content:space-between; align-items:center; font-size:13px; color:var(--sub); margin-top:4px; }
  .devrow b{ color:var(--text); }
  footer{ margin-top:26px; padding-top:12px; border-top:2px solid #50E040; color:var(--sub); font-size:12px;
    display:flex; justify-content:space-between; }
  .xlink{ display:block; margin-top:22px; padding:14px 16px; text-align:center; text-decoration:none;
    color:var(--navy); font-weight:700; border:1.5px solid var(--line); border-radius:12px; background:var(--card); }
  @media (prefers-color-scheme: dark){ .xlink{ color:#A9A5E8; border-color:#4a4780; } }
  .awm{ color:#2E9E46; font-weight:700; }
  .hidden{ display:none; }
  .ver{ text-align:center; color:var(--sub); font-size:12px; padding:8px 0 14px; letter-spacing:.01em }
  .hubbar{display:block;box-sizing:border-box;width:calc(100% - 32px);max-width:440px;margin:16px auto 8px;padding:15px 18px;background:#121318;color:#fff;font-family:'Syne',system-ui,sans-serif;font-weight:700;font-size:15.5px;text-align:center;text-decoration:none;border-radius:16px;box-shadow:0 4px 14px rgba(10,22,40,.18)}
  .hubbar:active{transform:scale(.99)} .hubbar:hover{filter:brightness(1.12)}
  .install{display:none;width:100%;margin-top:18px;padding:14px;border:0;border-radius:12px;background:var(--navy);color:#fff;font-weight:700;font-size:16px;align-items:center;justify-content:center;gap:9px;cursor:pointer;font-family:inherit}
  .install.show{display:flex}
  .install-tip{display:none;margin:9px 2px 0;font-size:13px;color:var(--sub)} .install-tip.show{display:block} .install-tip b{color:var(--text)}
  @media (hover:hover) and (pointer:fine){ .install.show{display:none!important} }
</style>
</head>

    row.querySelector('.lbl').textContent=it;
    row.addEventListener('click',function(){ ticks[id]=!ticks[id]; row.classList.toggle('on',!!ticks[id]); });
    groupsEl.appendChild(row);
  });
});

var declsEl = document.getElementById('decls');
DECLS.forEach(function(d,i){
  var el=document.createElement('div'); el.className='decl'+(i===1?' warnopt':''); el.setAttribute('data-d',d);
  el.innerHTML='<span class="r"></span><span></span>'; el.querySelector('span:last-child').textContent=d;
  el.addEventListener('click',function(){
    declChoice=d;
    Array.prototype.forEach.call(declsEl.children,function(c){ c.classList.remove('sel','warn'); });
    el.classList.add('sel'); if(i===1) el.classList.add('warn');
  });
  declsEl.appendChild(el);
});

document.getElementById('devName').textContent = device;
document.getElementById('renameBtn').addEventListener('click',function(){
  var n=prompt('Name for this device (shows in the sheet):', device);
  if(n){ device=n.trim().slice(0,40); localStorage.setItem('onevic_device',device); document.getElementById('devName').textContent=device; }
});
document.getElementById('syncNow').addEventListener('click', syncAll);
document.getElementById('save').addEventListener('click', submit);

/* ===================== SUBMIT ===================== */
function requiredMissing(){
  var miss=[];
  GROUPS.filter(function(g){return g.required;}).forEach(function(g){
    g.items.forEach(function(it){ if(!ticks[g.key+'|'+it]) miss.push(it); });
  });
  return miss;
}
function submit(){
  var warn=document.getElementById('warn'); warn.classList.add('hidden');
  var boat=boatEl.value.trim(), operator=document.getElementById('operator').value.trim();
  if(!boat || !operator || !declChoice){
    warn.textContent='Please choose a boat, enter the operator, and make the declaration.';
    warn.classList.remove('hidden'); window.scrollTo({top:0,behavior:'smooth'}); return;
  }
  var miss=requiredMissing();
  if(declChoice===DECLS[0] && miss.length){
    if(!confirm(miss.length+' required check'+(miss.length>1?'s are':' is')+" not ticked. Still mark 'safe to launch'?")) return;
  }
  var tickedList=[];
  GROUPS.forEach(function(g){ g.items.forEach(function(it){ if(ticks[g.key+'|'+it]) tickedList.push(it); }); });
  var rec={
    id:uuid(), device:device, deviceTime:new Date().toLocaleString(),
    boat:boat, operator:operator, callSign:document.getElementById('callSign').value.trim(),
    declaration:declChoice, allComplete: miss.length?'No':'Yes',
    ticked:tickedList.join('; '), notTicked:miss.join('; '),
    notes:document.getElementById('notes').value.trim(), status:'pending'
  };
  queue.unshift(rec); save(); resetForm(); render(); syncAll();
}
function resetForm(){
  ticks={}; declChoice=null;
  Array.prototype.forEach.call(document.querySelectorAll('.chk'),function(r){ r.classList.remove('on'); });
  Array.prototype.forEach.call(declsEl.children,function(c){ c.classList.remove('sel','warn'); });
  boatEl.value=''; document.getElementById('notes').value='';
}

/* ===================== SYNC ===================== */
function syncOne(rec){
  return fetch(WEBAPP_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(rec)})
    .then(function(r){return r.json();}).then(function(d){ if(d&&d.ok) return true; throw 0; })
    .catch(function(){
      return fetch(WEBAPP_URL+'?verify='+encodeURIComponent(rec.id)).then(function(r){return r.json();})
        .then(function(d){ return !!(d&&d.exists); }).catch(function(){ return false; });
    });
}
function syncAll(){
  if(!WEBAPP_URL || !navigator.onLine || syncing){ render(); return; }
  var pend=queue.filter(function(r){return r.status!=='synced';});
  if(!pend.length){ render(); return; }
  syncing=true; render();
  (function next(i){
    if(i>=pend.length){ syncing=false; render(); return; }
    syncOne(pend[i]).then(function(ok){ if(ok){ pend[i].status='synced'; save(); } render(); next(i+1); });
  })(0);
}

/* ===================== RENDER ===================== */
function render(){
  var pend=queue.filter(function(r){return r.status!=='synced';}).length;
  var s=document.getElementById('status'), t=document.getElementById('statusText');
  s.className='';
  if(!WEBAPP_URL){ s.className='s-wait'; t.textContent='Saving on this device only — add the sync link to send to the sheet.'; }
  else if(!navigator.onLine){ s.className='s-off'; t.textContent= pend? ('Offline — '+pend+' check-in'+(pend>1?'s':'')+' waiting, will sync when back online.') : 'Offline — all saved.'; }
  else if(syncing){ s.className='s-wait'; t.textContent='Syncing…'; }
  else if(pend){ s.className='s-wait'; t.textContent=pend+' check-in'+(pend>1?'s':'')+' waiting to sync.'; }
  else { s.className='s-ok'; t.textContent='All synced.'; }
  s.insertAdjacentHTML('afterbegin','<span class="dot"></span>');

  var rec=document.getElementById('recent');
  if(!queue.length){ rec.innerHTML='<div style="color:var(--sub);font-size:14px;padding:8px 4px">No check-ins yet.</div>'; return; }
  rec.innerHTML='';
  queue.slice(0,12).forEach(function(r){
    var row=document.createElement('div'); row.className='rec';
    var synced=r.status==='synced';
    row.innerHTML='<span class="who"></span><span class="when"></span><span class="chip '+(synced?'sy':'pe')+'">'+(synced?'✓ Synced':'⏳ Pending')+'</span>';
    row.querySelector('.who').textContent=r.boat+' · '+r.operator;
    row.querySelector('.when').textContent=r.deviceTime;
    rec.appendChild(row);
  });
}

/* ===================== LIFECYCLE ===================== */
window.addEventListener('online', syncAll);
window.addEventListener('offline', render);
setInterval(syncAll, 15000);
render(); syncAll();

var INSTALL_ENABLED=false; /* deactivated — installable from the browser menu; flip to true for the on-page button */
(function(){ var btn=document.getElementById('install'), tip=document.getElementById('installTip');
  if(!btn||!INSTALL_ENABLED) return;
  if(window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true) return;
  var dfd=null, isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();dfd=e;btn.classList.add('show');});
  if(window.matchMedia('(pointer: coarse)').matches) btn.classList.add('show');
  btn.addEventListener('click',function(){ if(dfd){dfd.prompt();dfd.userChoice.finally(function(){dfd=null;btn.classList.remove('show');});return;}
    tip.innerHTML=isIOS?'Tap <b>Share</b>, then <b>Add to Home Screen</b>.':'Open the browser menu <b>(\u22EE)</b>, then <b>Add to Home screen</b>.'; tip.classList.add('show'); });
})();
if('serviceWorker' in navigator){ navigator.serviceWorker.register('./sw.js').catch(function(){}); }
</script>
