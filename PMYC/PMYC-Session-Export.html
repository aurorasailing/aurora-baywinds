<!-- Aurora Explorer · PMYC-Session-Export.html · v1.6 · 2026-10-22 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Session Export — Port Melbourne · Aurora Explorer</title>
<meta name="description" content="Assemble a whole PMYC session — briefing and conditions, powerboat checks and the review — into one sheet, as a PDF or as markdown to paste elsewhere.">
<meta name="theme-color" content="#F5F7F4">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme: light;
    --navy:#0A1628; --green:#50E040; --green-b:#39D455; --slate:#2E4057; --ink:#1C2B3A;
    --muted:#7A8A7E; --line:#E1E6E0; --seafoam:#E8EDE6; --harbour:#F5F7F4; --white:#fff;
    --pad:20px;
  }
  *{box-sizing:border-box} html,body{margin:0}
  body{font-family:'Lato',-apple-system,system-ui,sans-serif;color:var(--ink);background:var(--harbour);line-height:1.6;min-height:100vh}

  header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px var(--pad);
    padding-top:calc(12px + env(safe-area-inset-top,0));background:var(--white);border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:baseline;gap:9px;text-decoration:none}
  .brand .a{font-family:'Syne',sans-serif;font-weight:800;font-size:17px;letter-spacing:.02em;text-transform:uppercase;color:var(--green)}
  .brand .b{font-family:'Syne',sans-serif;font-weight:600;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
  .hublink{font-family:'Syne',sans-serif;font-weight:700;font-size:12.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);text-decoration:none;white-space:nowrap}

  main{max-width:720px;margin:0 auto;padding:18px var(--pad) 8px}
  .eyebrow{font-family:'Syne',sans-serif;font-weight:600;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--green-b)}
  h1{font-family:'Syne',sans-serif;font-weight:800;font-size:clamp(28px,7vw,40px);line-height:1.05;margin:6px 0 12px;color:var(--navy)}

  .controls{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin:6px 0 4px}
  .controls label{display:block;font-size:12px;font-weight:700;color:var(--slate);margin-bottom:4px}
  .controls select,.controls input{padding:11px;font-size:16px;font-family:inherit;border:1px solid var(--line);border-radius:11px;background:#fff;color:var(--ink)}
  .controls .pick{flex:1;min-width:200px}
  .status{font-size:13.5px;color:var(--muted);margin:10px 2px}
  .actions{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0 2px}
  .btn{font-family:'Syne',sans-serif;font-weight:800;font-size:15px;border:none;border-radius:12px;padding:12px 16px;cursor:pointer}
  .btn.pdf{background:var(--navy);color:#fff}
  .btn.copy{background:var(--green);color:var(--navy)}
  .btn.ghost{background:#fff;color:var(--slate);border:1px solid var(--line);font-weight:700}
  .btn:active{transform:scale(.99)}

  /* rendered session sheet */
  .sheet{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px 20px 8px;margin:14px 0 4px}
  .sheet .sh-date{font-family:'Syne',sans-serif;font-weight:800;font-size:22px;color:var(--navy);margin:0 0 2px}
  .sheet .sh-sub{font-size:13px;color:var(--muted);margin:0 0 6px}
  .block{margin:18px 0 0;break-inside:avoid}
  .block h3{font-family:'Syne',sans-serif;font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--green-b);margin:0 0 8px;padding-bottom:5px;border-bottom:1px solid var(--line)}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;font-size:14.5px;margin:0}
  .kv dt{color:var(--muted)}
  .kv dd{margin:0;color:var(--ink)}
  .item{padding:10px 0;border-top:1px solid var(--line)}
  .item:first-of-type{border-top:none}
  .item .it-h{font-family:'Syne',sans-serif;font-weight:700;font-size:15.5px;color:var(--navy);margin:0 0 4px}
  .item .it-h .t{color:var(--muted);font-family:'Lato';font-weight:400;font-size:13px;margin-left:6px}
  .para{font-size:14.5px;margin:4px 0}
  .para b{color:var(--slate)}
  .flag{display:inline-block;background:#FFF6E6;color:#9A6700;border-radius:999px;padding:1px 9px;font-size:12.5px;font-weight:700;margin:2px 4px 2px 0}
  .empty{color:var(--muted);font-size:14px}

  details.md{margin:14px 0}
  details.md summary{font-family:'Syne',sans-serif;font-weight:700;font-size:13px;color:var(--slate);cursor:pointer}
  textarea.md-text{width:100%;height:280px;margin-top:8px;padding:12px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;border:1px solid var(--line);border-radius:11px;background:#fff;color:var(--ink);white-space:pre}

  .print-head{display:none}
  footer{border-top:1px solid var(--line);padding:16px var(--pad);color:var(--muted);font-size:12.5px;text-align:center;margin-top:24px}
  footer a{color:var(--green-b);text-decoration:none}
  .ver{margin-top:8px;font-family:'Syne',sans-serif;font-size:11px;letter-spacing:.04em;color:var(--muted)}

  @page{ margin:16mm; }
  @media print{
    .mapfit{overflow:visible !important;break-inside:avoid}
    header,.controls,.actions,.status,details.md,footer,.hublink{display:none !important}
    body{background:#fff}
    main{max-width:none;margin:0;padding:0}
    .sheet{border:none;border-radius:0;padding:0;margin:0}
    .print-head{display:flex;align-items:baseline;gap:8px;margin:0 0 10px;border-bottom:2px solid var(--navy);padding-bottom:6px}
    .print-head .a{font-family:'Syne',sans-serif;font-weight:800;color:var(--navy);text-transform:uppercase;letter-spacing:.02em}
    .print-head .b{font-family:'Syne',sans-serif;font-weight:600;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
    .block{break-inside:avoid}
  }
</style>
</head>
<body>
<header>
  <a class="brand" href="index.html"><span class="a">Aurora</span><span class="b">Sailing</span></a>
  <a class="hublink" href="index.html">Hub ↑</a>
</header>
<main>
  <span class="eyebrow">Port Melbourne Yacht Club</span>
  <h1>Session export</h1>

  <div class="controls">
    <div class="pick">
      <label for="ex-sessions">Session</label>
      <select id="ex-sessions" style="width:100%"><option>Loading…</option></select>
    </div>
    <div>
      <label for="ex-date">or a date</label>
      <input type="date" id="ex-date">
    </div>
    <button type="button" class="btn ghost" id="ex-load">Load</button>
  </div>
  <div class="status" id="ex-status">Pick a session to assemble.</div>

  <div class="actions" id="ex-actions" style="display:none">
    <button type="button" class="btn pdf" id="ex-pdf">Save as PDF</button>
    <button type="button" class="btn copy" id="ex-copy">Copy markdown</button>
  </div>

  <div id="ex-out"></div>

  <details class="md" id="ex-mdwrap" style="display:none">
    <summary>Markdown (select &amp; copy)</summary>
    <textarea class="md-text" id="ex-md" readonly></textarea>
  </details>
</main>
<footer>
  Reads the shared sheet — needs a connection. The on-water pages don't; this one does.
  <div style="margin-top:8px"><a href="https://aurorasailing.com.au">Aurora Sailing</a> · Melbourne</div>
  <div class="ver">PMYC-Session-Export.html · v1.6</div>
</footer>
<script>
(function(){
  var WEBAPP_URL = "https://script.google.com/macros/s/AKfycbxOX6w8LPqXPVxMcyQGciFde1RP16FyGgBRunBTrqDu6rZ0qKbFvqFryDNSWKVhNo0M/exec";
  var out=document.getElementById('ex-out'), statusEl=document.getElementById('ex-status'),
      sel=document.getElementById('ex-sessions'), dateIn=document.getElementById('ex-date'),
      actions=document.getElementById('ex-actions'), mdWrap=document.getElementById('ex-mdwrap'), mdText=document.getElementById('ex-md');
  var currentMD='';

  function esc(s){ return String(s==null?'':s).replace(/[&<>]/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]; }); }
  function v(o,k){ return (o && o[k]!=null) ? String(o[k]).trim() : ''; }
  function has(o,k){ return v(o,k)!==''; }

  /* ---------- load the list of available sessions ---------- */
  function loadDates(){
    statusEl.textContent='Loading sessions…';
    fetch(WEBAPP_URL+'?dates=1&_='+Date.now()).then(function(r){ return r.json(); }).then(function(d){
      if(!d || !d.ok || !d.dates || !d.dates.length){ sel.innerHTML='<option value="">No sessions yet</option>'; statusEl.textContent='No sessions recorded yet.'; return; }
      sel.innerHTML='';
      d.dates.forEach(function(s){
        var bits=[]; if(s.briefings) bits.push(s.briefings+' briefing'+(s.briefings>1?'s':''));
        if(s.checkins) bits.push(s.checkins+' check'+(s.checkins>1?'s':'')); if(s.reviews) bits.push(s.reviews+' review'+(s.reviews>1?'s':'')); if(s.gpx) bits.push(s.gpx+' track'+(s.gpx>1?'s':''));
        var o=document.createElement('option'); o.value=s.date; o.textContent=prettyDate(s.date)+'  —  '+bits.join(' · '); sel.appendChild(o);
      });
      statusEl.textContent='Pick a session, then Load.';
      sel.value=d.dates[0].date; dateIn.value=d.dates[0].date; loadSession(d.dates[0].date);
    }).catch(function(){ sel.innerHTML='<option value="">Couldn’t reach the sheet</option>'; statusEl.textContent='Couldn’t reach the sheet — check your connection and try again.'; });
  }

  function prettyDate(iso){
    var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(iso||''); if(!m) return iso||'';
    var d=new Date(+m[1],+m[2]-1,+m[3]);
    return d.toLocaleDateString('en-AU',{weekday:'short',day:'numeric',month:'short',year:'numeric'});
  }

  /* ---------- load + render one session ---------- */
  function loadSession(date){
    if(!date){ return; }
    statusEl.textContent='Assembling '+prettyDate(date)+'\u2026'; out.innerHTML=''; actions.style.display='none'; mdWrap.style.display='none';
    fetch(WEBAPP_URL+'?session='+encodeURIComponent(date)+'&_='+Date.now()).then(function(r){ return r.json(); }).then(function(d){
      if(!d || !d.ok){ statusEl.textContent='Couldn\u2019t load that session.'; return; }
      var total=(d.briefings||[]).length+(d.checkins||[]).length+(d.reviews||[]).length+(d.gpx||[]).length;
      if(!total){ statusEl.textContent='No records for '+prettyDate(date)+'.'; return; }
      d.wx = weatherFromRows(d.weather||[]);               // saved trace if any — report never waits on the network
      showReport(d, total, date);
      if(!d.wx){                                           // first export: fetch live wind in the background, then refresh + save
        var win=sessionWindow(d);
        if(win){ buildWeatherTimed(win).then(function(wx){ if(wx){ d.wx=wx; saveWeather(date, wx); showReport(d, total, date); } }); }
      }
      if(MAP_TOKEN && (d.gpx||[]).some(function(g){ return v(g,'Track') && !g.__mapimg; })){
        Promise.all((d.gpx||[]).map(function(g){ if(g.__mapimg || !v(g,'Track')) return Promise.resolve(); return mapImageFor(v(g,'Track')).then(function(img){ if(img) g.__mapimg=img; }); })).then(function(){ showReport(d, total, date); });
      }
    }).catch(function(){ statusEl.textContent='Couldn\u2019t reach the sheet \u2014 check your connection and try again.'; });
  }
  function showReport(d, total, date){
    out.innerHTML = renderHTML(d);
    currentMD = renderMD(d); mdText.value = currentMD;
    statusEl.textContent = prettyDate(date)+' \u2014 '+total+' record'+(total>1?'s':'')+' assembled'+(d.wx?', weather included':'')+'.';
    actions.style.display='flex'; mdWrap.style.display='block';
  }
  function buildWeatherTimed(win){
    return Promise.race([ buildWeather(win), new Promise(function(res){ setTimeout(function(){ res(null); }, 8000); }) ]);
  }

  /* Print / Save-as-PDF by writing just the report into a clean off-screen document — avoids the whole app page's CSS and the macOS blank-page quirk. */
  var PRINT_CSS = ":root{--navy:#0A1628;--green-b:#39D455;--slate:#2E4057;--ink:#1C2B3A;--muted:#7A8A7E;--line:#E1E6E0}"
    +"*{box-sizing:border-box}@page{margin:16mm}"
    +"html,body{margin:0;padding:0;background:#fff;color:var(--ink);font-family:'Lato',-apple-system,system-ui,sans-serif;line-height:1.55;font-size:13px;-webkit-print-color-adjust:exact;print-color-adjust:exact}"
    +".print-head{display:flex;align-items:baseline;gap:8px;margin:0 0 12px;border-bottom:2px solid var(--navy);padding-bottom:6px}"
    +".print-head .a{font-family:'Syne',sans-serif;font-weight:800;color:var(--navy);text-transform:uppercase;letter-spacing:.02em}"
    +".print-head .b{font-family:'Syne',sans-serif;font-weight:600;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}"
    +".sh-date{font-family:'Syne',sans-serif;font-weight:800;font-size:22px;color:var(--navy);margin:0 0 2px}"
    +".sh-sub{font-size:13px;color:var(--muted);margin:0 0 6px}"
    +".block{margin:16px 0 0;break-inside:avoid;page-break-inside:avoid}"
    +".block h3{font-family:'Syne',sans-serif;font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--green-b);margin:0 0 7px;padding-bottom:5px;border-bottom:1px solid var(--line)}"
    +".kv{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;font-size:13.5px;margin:0}"
    +".kv dt{color:var(--muted)}.kv dd{margin:0;color:var(--ink)}"
    +".item{padding:9px 0;border-top:1px solid var(--line)}.item:first-of-type{border-top:none}"
    +".item .it-h{font-family:'Syne',sans-serif;font-weight:700;font-size:15px;color:var(--navy);margin:0 0 4px}"
    +".item .it-h .t{color:var(--muted);font-weight:400;font-size:12.5px;margin-left:6px}"
    +".para{font-size:13.5px;margin:4px 0}.para b{color:var(--slate)}"
    +".flag{display:inline-block;background:#FFF6E6;color:#9A6700;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:700;margin:2px 4px 2px 0}"
    +".mapfit{break-inside:avoid;page-break-inside:avoid;margin-top:6px;border:1px solid var(--line);border-radius:12px;overflow:hidden}"
    +".mapfit svg,.mapfit img{display:block;width:100%;height:auto}.sheet{padding:0;margin:0}";
  function printReport(){
    if(!out.innerHTML.trim()){ return; }
    var html='<!doctype html><html><head><meta charset="utf-8"><title>PMYC session</title>'
      +'<link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">'
      +'<style>'+PRINT_CSS+'</style></head><body>'+out.innerHTML+'</body></html>';
    var ifr=document.createElement('iframe');
    ifr.setAttribute('aria-hidden','true');
    ifr.style.cssText='position:fixed;left:-9999px;top:0;width:900px;height:1200px;border:0';
    document.body.appendChild(ifr);
    var doc=ifr.contentWindow.document; doc.open(); doc.write(html); doc.close();
    setTimeout(function(){
      try{ ifr.contentWindow.focus(); ifr.contentWindow.print(); }
      catch(e){ try{ window.print(); }catch(_){} }
      setTimeout(function(){ try{ ifr.parentNode.removeChild(ifr); }catch(e){} }, 1500);
    }, 600);
  }

  function kv(pairs){
    var r=''; pairs.forEach(function(p){ if(p[1]!=='' && p[1]!=null) r+='<dt>'+esc(p[0])+'</dt><dd>'+esc(p[1])+'</dd>'; });
    return r ? '<dl class="kv">'+r+'</dl>' : '';
  }
  function para(label,text){ return text ? '<p class="para"><b>'+esc(label)+':</b> '+esc(text)+'</p>' : ''; }

  function trackSVG(thin,w,hh){
    var lats=thin.map(function(p){return p[0];}), lons=thin.map(function(p){return p[1];});
    var minLo=Math.min.apply(null,lons), maxLa=Math.max.apply(null,lats);
    var lat0=(Math.min.apply(null,lats)+maxLa)/2, k=Math.cos(lat0*Math.PI/180);
    var X=thin.map(function(p){return (p[1]-minLo)*k;}), Y=thin.map(function(p){return (maxLa-p[0]);});
    var ww=Math.max.apply(null,X)||1e-6, hgt=Math.max.apply(null,Y)||1e-6, pad=14;
    var sc=Math.min((w-2*pad)/ww,(hh-2*pad)/hgt), ox=(w-ww*sc)/2, oy=(hh-hgt*sc)/2;
    var dd='M'+X.map(function(x,i){return (x*sc+ox).toFixed(1)+','+(Y[i]*sc+oy).toFixed(1);}).join(' L');
    var sx=(X[0]*sc+ox).toFixed(1), sy=(Y[0]*sc+oy).toFixed(1), ex=(X[X.length-1]*sc+ox).toFixed(1), ey=(Y[Y.length-1]*sc+oy).toFixed(1);
    return '<svg viewBox="0 0 '+w+' '+hh+'" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;display:block">'
      +'<rect width="'+w+'" height="'+hh+'" fill="#EEF1EC"/>'
      +'<path d="'+dd+'" fill="none" stroke="#0A1628" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>'
      +'<circle cx="'+sx+'" cy="'+sy+'" r="5" fill="#39D455"/><circle cx="'+ex+'" cy="'+ey+'" r="5" fill="#F0792E"/></svg>';
  }
  function trackFromString(str){ if(!str) return ''; var thin=str.split(';').map(function(s){ var a=s.split(','); return [parseFloat(a[0]),parseFloat(a[1])]; }).filter(function(p){ return isFinite(p[0])&&isFinite(p[1]); }); if(thin.length<2) return ''; return trackSVG(thin,680,300); }

  /* ---------- real-map track image (optional) ----------
     Paste a free Mapbox public token below to swap the self-contained SVG track for map tiles with the
     track drawn on top. Make one at mapbox.com (free), restrict it to your domain. Empty = keep the SVG. */
  var MAP_TOKEN = "";                       // e.g. "pk.xxxxx"
  var MAP_STYLE = "outdoors-v12";           // or "satellite-streets-v12" for aerial
  function encodePolyline(pts){
    var out='', lastLat=0, lastLon=0;
    function enc(v){ v=v<0?~(v<<1):(v<<1); var s=''; while(v>=0x20){ s+=String.fromCharCode((0x20|(v&0x1f))+63); v=v>>5; } s+=String.fromCharCode(v+63); return s; }
    for(var i=0;i<pts.length;i++){ var la=Math.round(pts[i][0]*1e5), lo=Math.round(pts[i][1]*1e5); out+=enc(la-lastLat)+enc(lo-lastLon); lastLat=la; lastLon=lo; }
    return out;
  }
  function mapImageFor(trackStr){
    if(!MAP_TOKEN) return Promise.resolve(null);
    var pts=(trackStr||'').split(';').map(function(s){ var a=s.split(','); return [parseFloat(a[0]),parseFloat(a[1])]; }).filter(function(p){ return isFinite(p[0])&&isFinite(p[1]); });
    if(pts.length<2) return Promise.resolve(null);
    var enc=encodeURIComponent(encodePolyline(pts)), s=pts[0], e=pts[pts.length-1];
    var overlay='pin-s+39d455('+s[1].toFixed(5)+','+s[0].toFixed(5)+'),pin-s+f0792e('+e[1].toFixed(5)+','+e[0].toFixed(5)+'),path-5+50e040-0.95('+enc+')';
    var url='https://api.mapbox.com/styles/v1/mapbox/'+MAP_STYLE+'/static/'+overlay+'/auto/680x420@2x?padding=36&access_token='+encodeURIComponent(MAP_TOKEN);
    return fetch(url).then(function(r){ if(!r.ok) throw 0; return r.blob(); })
      .then(function(b){ return new Promise(function(res,rej){ var fr=new FileReader(); fr.onload=function(){ res(fr.result); }; fr.onerror=function(){ rej(); }; fr.readAsDataURL(b); }); })
      .catch(function(){ return null; });
  }

  /* ---------- session weather: wind from the bay stations (both), speed line + direction barbs ---------- */
  var WX_BASE="https://aurora-baywinds.gregor-fea.workers.dev";
  var WX_STATIONS=[{id:95872,name:"Fawkner Beacon"},{id:95864,name:"RMYS \u00b7 St Kilda"}];
  var DIRDEG={N:0,NNE:22.5,NE:45,ENE:67.5,E:90,ESE:112.5,SE:135,SSE:157.5,S:180,SSW:202.5,SW:225,WSW:247.5,W:270,WNW:292.5,NW:315,NNW:337.5};
  function dirDeg(d){ d=(d||'').toUpperCase(); return (d in DIRDEG)?DIRDEG[d]:null; }
  function shortStation(n){ if(/fawkner/i.test(n)) return 'Fawkner'; if(/rmys|kilda/i.test(n)) return 'RMYS'; return (n||'').slice(0,8); }
  function num(x){ x=parseFloat(x); return isFinite(x)?x:null; }
  function hhmmToMin(s){ var m=/^(\d{1,2}):(\d{2})/.exec(s||''); return m?(+m[1]*60+ +m[2]):null; }
  function pad2(n){ return (n<10?'0':'')+n; }
  function addDayCompact(ymd){ var y=+ymd.slice(0,4),mo=+ymd.slice(4,6),da=+ymd.slice(6,8); var dt=new Date(Date.UTC(y,mo-1,da)+86400000); return ''+dt.getUTCFullYear()+pad2(dt.getUTCMonth()+1)+pad2(dt.getUTCDate()); }
  function keyFor(ymd,minutes){ var day=ymd; if(minutes>=1440){ day=addDayCompact(ymd); minutes-=1440; } return day+pad2(Math.floor(minutes/60))+pad2(minutes%60); }
  function hhmmOfMin(minutes){ minutes=((minutes%1440)+1440)%1440; return pad2(Math.floor(minutes/60))+':'+pad2(minutes%60); }
  function sessionWindow(d){
    var ymd=(d.date||'').replace(/-/g,''); if(ymd.length!==8) return null;
    var starts=[], ends=[];
    (d.briefings||[]).forEach(function(b){ var m=hhmmToMin(b['Time']); if(m!=null) starts.push(m); });
    (d.checkins||[]).forEach(function(c){ var m=hhmmToMin(c['Time']); if(m!=null) starts.push(m); });
    (d.gpx||[]).forEach(function(g){ var m=hhmmToMin(g['Time']); if(m!=null){ starts.push(m); var dur=parseInt(g['Duration (min)'],10); if(isFinite(dur)) ends.push(m+dur); } });
    (d.reviews||[]).forEach(function(r){ var m=hhmmToMin(r['Time']); if(m!=null) ends.push(m); });
    if(!starts.length){ (d.reviews||[]).forEach(function(r){ var m=hhmmToMin(r['Time']); if(m!=null) starts.push(m); }); }
    if(!starts.length) return null;
    var start=Math.min.apply(null,starts);

  function fetchStation(st,win){
    return fetch(WX_BASE+'/'+st.id+'.json?_='+Date.now()).then(function(r){ return r.json(); }).then(function(j){
      var data=(j&&(j.observations?j.observations.data:j.data))||[]; var pts=[];
      for(var i=0;i<data.length;i++){ var o=data[i], k=String(o.local_date_time_full||'').slice(0,12);
        if(k.length===12 && k>=win.startKey && k<=win.endKey){ pts.push({ key:k, hhmm:k.slice(8,10)+':'+k.slice(10,12), spd:num(o.wind_spd_kt), gust:num(o.gust_kt), dir:(o.wind_dir||'') }); } }
      pts.sort(function(a,b){ return a.key<b.key?-1:(a.key>b.key?1:0); }); return { name:st.name, pts:pts };
    }).catch(function(){ return { name:st.name, pts:[] }; });
  }
  function wxSummary(pts){
    var spd=pts.map(function(p){return p.spd;}).filter(function(x){return x!=null;});
    var gust=pts.map(function(p){return p.gust;}).filter(function(x){return x!=null;});
    var dirs=pts.map(function(p){return p.dir;}).filter(Boolean);
    var s=''; if(spd.length){ s+='Wind '+Math.min.apply(null,spd)+'\u2013'+Math.max.apply(null,spd)+' kt'; }
    if(gust.length){ s+=(s?', ':'')+'gusting '+Math.max.apply(null,gust); }
    if(dirs.length){ var a=dirs[0], b=dirs[dirs.length-1]; s+=(s?' \u00b7 ':'')+(a===b?a:(a+'\u2192'+b)); }
    return s||'\u2014';
  }
  function buildWeather(win){
    return Promise.all(WX_STATIONS.map(function(s){ return fetchStation(s,win); })).then(function(res){
      var sta=res.filter(function(r){ return r.pts.length>=2; });
      if(!sta.length) return null;
      sta.sort(function(a,b){ return b.pts.length-a.pts.length; });
      return { startHHMM:win.startHHMM, endHHMM:win.endHHMM, stations:sta.map(function(r){ return { station:r.name, series:r.pts, summary:wxSummary(r.pts) }; }) };
    });
  }
  function weatherFromRows(rows){
    if(!rows || !rows.length) return null;
    var sta=rows.map(function(row){
      var series=String(row['Series']||'').split(';').map(function(s){ var a=s.split(','); var t=a[0]||''; return { hhmm:t.length>=4?(t.slice(0,2)+':'+t.slice(2,4)):t, spd:num(a[1]), gust:num(a[2]), dir:a[3]||'' }; }).filter(function(p){ return p.hhmm; });
      return { station:row['Station']||'', series:series, summary:row['Summary']||wxSummary(series), start:row['Window start']||'', end:row['Window end']||'' };
    }).filter(function(s){ return s.series.length>=2; });
    if(!sta.length) return null;
    sta.sort(function(a,b){ return b.series.length-a.series.length; });
    return { startHHMM:sta[0].start, endHHMM:sta[0].end, stations:sta };
  }
  function saveWeather(date,wx){
    wx.stations.forEach(function(st){
      var series=st.series.map(function(p){ return (p.hhmm||'').replace(':','')+','+(p.spd==null?'':p.spd)+','+(p.gust==null?'':p.gust)+','+(p.dir||''); }).join(';');
      var code=(st.station||'x').replace(/[^A-Za-z0-9]/g,'').slice(0,6);
      var rec={ type:'weather', id:'weather-'+date+'-'+code, date:date, station:st.station, windowStart:wx.startHHMM, windowEnd:wx.endHHMM, series:series, summary:st.summary, device:'export' };
      try{ fetch(WEBAPP_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(rec)}); }catch(e){}
    });
  }
  function ensureWeather(d){
    var fromRows=weatherFromRows(d.weather||[]); if(fromRows){ d.wx=fromRows; return Promise.resolve(); }
    var win=sessionWindow(d); if(!win) return Promise.resolve();
    return buildWeather(win).then(function(wx){ if(wx){ d.wx=wx; saveWeather(d.date,wx); } }).catch(function(){});
  }
  /* a meteorological wind barb: staff points the way the wind comes FROM; half-barb 5 kt, full 10, pennant 50 */
  function barb(cx,cy,deg,spd){
    var r=Math.PI/180, ux=Math.sin(deg*r), uy=-Math.cos(deg*r), px=uy, py=-ux;
    var L=15, BL=6, step=3.4, col='#2E4057';
    var speed=Math.round((spd||0)/5)*5;
    if(speed<2.5) return '<circle cx="'+cx.toFixed(1)+'" cy="'+cy.toFixed(1)+'" r="2.6" fill="none" stroke="'+col+'" stroke-width="1.1"/>';
    var out='<line x1="'+cx.toFixed(1)+'" y1="'+cy.toFixed(1)+'" x2="'+(cx+ux*L).toFixed(1)+'" y2="'+(cy+uy*L).toFixed(1)+'" stroke="'+col+'" stroke-width="1.3"/>';
    var n50=Math.floor(speed/50); speed-=n50*50; var n10=Math.floor(speed/10); speed-=n10*10; var n5=Math.floor(speed/5);
    var t=L; function P(tt){ return [cx+ux*tt, cy+uy*tt]; }
    var i,A,B,tip;
    for(i=0;i<n50;i++){ A=P(t); B=P(t-step*1.4); tip=[A[0]+px*BL,A[1]+py*BL];
      out+='<path d="M'+A[0].toFixed(1)+','+A[1].toFixed(1)+' L'+tip[0].toFixed(1)+','+tip[1].toFixed(1)+' L'+B[0].toFixed(1)+','+B[1].toFixed(1)+' Z" fill="'+col+'"/>'; t-=step*1.7; }
    for(i=0;i<n10;i++){ A=P(t); out+='<line x1="'+A[0].toFixed(1)+'" y1="'+A[1].toFixed(1)+'" x2="'+(A[0]+px*BL).toFixed(1)+'" y2="'+(A[1]+py*BL).toFixed(1)+'" stroke="'+col+'" stroke-width="1.3"/>'; t-=step; }
    for(i=0;i<n5;i++){ A=(n10||n50)?P(t):P(t-step*0.5); out+='<line x1="'+A[0].toFixed(1)+'" y1="'+A[1].toFixed(1)+'" x2="'+(A[0]+px*BL*0.5).toFixed(1)+'" y2="'+(A[1]+py*BL*0.5).toFixed(1)+'" stroke="'+col+'" stroke-width="1.3"/>'; t-=step; }
    return out;
  }
  function sampleBarbs(series,startMin,endMin){
    function absMin(p){ var m=hhmmToMin(p.hhmm); if(m!=null && m<startMin) m+=1440; return m; }
    var out=[];
    for(var g=Math.ceil(startMin/30)*30; g<=endMin; g+=30){
      var best=null, bd=19;
      for(var i=0;i<series.length;i++){ var m=absMin(series[i]); if(m==null) continue; var diff=Math.abs(m-g); if(diff<=18 && diff<bd){ bd=diff; best=series[i]; } }
      if(best) out.push({ g:g, spd:best.spd, deg:dirDeg(best.dir) });
    }
    return out;
  }
  function weatherSVG(wx,w){
    var startMin=hhmmToMin(wx.startHHMM), endMin=hhmmToMin(wx.endHHMM); if(endMin==null||startMin==null) return '';
    if(endMin<=startMin) endMin+=1440;
    function absMin(p){ var m=hhmmToMin(p.hhmm); if(m!=null && m<startMin) m+=1440; return m; }
    var pad={l:44,r:12,t:14}, plotH=140, rowH=34, nSt=wx.stations.length;
    var h=pad.t+plotH+10+nSt*rowH+16;
    function X(absm){ return pad.l+(w-pad.l-pad.r)*((absm-startMin)/(endMin-startMin||1)); }
    var vals=[]; wx.stations.forEach(function(st){ st.series.forEach(function(p){ if(p.spd!=null)vals.push(p.spd); if(p.gust!=null)vals.push(p.gust); }); });
    var ymax=Math.ceil((Math.max.apply(null,vals.length?vals:[10])+2)/5)*5||5;
    function Y(v){ return pad.t+plotH-(plotH-10)*(v/ymax); }
    var prim=wx.stations[0];
    var svg='<svg viewBox="0 0 '+w+' '+h+'" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;display:block;background:#fff">';
    for(var g=0;g<=ymax;g+=5){ var y=Y(g).toFixed(1); svg+='<line x1="'+pad.l+'" y1="'+y+'" x2="'+(w-pad.r)+'" y2="'+y+'" stroke="#E1E6E0"/><text x="'+(pad.l-4)+'" y="'+(+y+3)+'" text-anchor="end" font-size="9" fill="#7A8A7E" font-family="sans-serif">'+g+'</text>'; }
    function lineOf(series,key,color,wd){ var dd='',started=false; series.forEach(function(p){ var v=p[key], am=absMin(p); if(v==null||am==null) return; dd+=(started?' L':'M')+X(am).toFixed(1)+','+Y(v).toFixed(1); started=true; }); return dd?'<path d="'+dd+'" fill="none" stroke="'+color+'" stroke-width="'+wd+'" stroke-linejoin="round"/>':''; }
    svg+=lineOf(prim.series,'gust','#B9C2BA',1.5)+lineOf(prim.series,'spd','#0A1628',2);
    svg+='<text x="'+(w-pad.r)+'" y="'+(pad.t-2)+'" text-anchor="end" font-size="8.5" fill="#7A8A7E" font-family="sans-serif">kt \u00b7 '+esc(shortStation(prim.station))+' speed/gust</text>';
    svg+='<line x1="'+pad.l+'" y1="'+(pad.t+plotH+4)+'" x2="'+(w-pad.r)+'" y2="'+(pad.t+plotH+4)+'" stroke="#E1E6E0"/>';
    wx.stations.forEach(function(st, si){
      var rowY=pad.t+plotH+10+si*rowH+rowH/2;
      svg+='<text x="'+(pad.l-4)+'" y="'+(rowY+3).toFixed(1)+'" text-anchor="end" font-size="8.5" fill="#7A8A7E" font-family="sans-serif">'+esc(shortStation(st.station))+'</text>';
      sampleBarbs(st.series,startMin,endMin).forEach(function(b){ if(b.deg==null) return; svg+=barb(X(b.g),rowY,b.deg,b.spd); });
    });
    svg+='<text x="'+X(startMin).toFixed(1)+'" y="'+(h-4)+'" font-size="9" fill="#7A8A7E" font-family="sans-serif">'+wx.startHHMM+'</text><text x="'+X(endMin).toFixed(1)+'" y="'+(h-4)+'" text-anchor="end" font-size="9" fill="#7A8A7E" font-family="sans-serif">'+wx.endHHMM+'</text>';
    return svg+'</svg>';
  }

  dateIn.addEventListener('change', function(){ loadSession(dateIn.value); });
  document.getElementById('ex-pdf').addEventListener('click', printReport);
  document.getElementById('ex-copy').addEventListener('click', function(){
    var btn=this;
    function done(ok){ btn.textContent = ok?'Copied ✓':'Select the text below'; setTimeout(function(){ btn.textContent='Copy markdown'; }, 1800); if(!ok){ mdWrap.open=true; mdText.focus(); mdText.select(); } }
    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(currentMD).then(function(){ done(true); }).catch(function(){ done(false); }); }
    else { mdWrap.open=true; mdText.focus(); mdText.select(); try{ done(document.execCommand('copy')); }catch(e){ done(false); } }
  });

  loadDates();
})();
</script>
</body>
</html>
