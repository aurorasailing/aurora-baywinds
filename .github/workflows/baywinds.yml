name: Mirror Bay Winds

on:
  schedule:
    - cron: "*/5 * * * *"    # every 5 min — GitHub's floor; may run a little late
  workflow_dispatch:          # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: baywinds
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Pull the five bay stations
        run: |
          if [ ! -f fetch_baywinds.py ]; then
            echo "::error::fetch_baywinds.py is not at the top level of the repo. Files here:"
            ls -la
            exit 1
          fi
          python3 fetch_baywinds.py

      - name: Commit if anything changed
        run: |
          git config user.name  "baywinds-bot"
          git config user.email "actions@github.com"
          git add -A data/
          if git diff --cached --quiet; then
            echo "No change this run."
          else
            git commit -m "wind: refresh $(date -u '+%Y-%m-%d %H:%M UTC')"
            git pull --rebase --autostash || true
            git push
          fi
