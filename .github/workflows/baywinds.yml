# Aurora Bay Winds · workflow (baywinds.yml) · v2.1 (self-restarting loop) · 2026-09-14
name: Mirror Bay Winds

on:
  workflow_dispatch:          # start it once by hand; from then on it restarts itself

permissions:
  contents: write
  actions: write              # lets a run trigger the next run

concurrency:
  group: baywinds
  cancel-in-progress: false   # never run two loops at once; the next one waits its turn

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v5

      - name: Mirror in a loop for ~46 minutes
        run: |
          echo "workflow v2.1 (self-restarting loop)"
          if [ ! -f fetch_baywinds.py ]; then
            echo "::error::fetch_baywinds.py is not at the top level of the repo. Files here:"
            ls -la
            exit 1
          fi
          git config user.name  "baywinds-bot"
          git config user.email "actions@github.com"
          END=$(( SECONDS + 2760 ))         # ~46 minutes, then hand off (below)
          while [ "$SECONDS" -lt "$END" ]; do
            python3 fetch_baywinds.py || true
            git add -A data/
            if git diff --cached --quiet; then
              echo "no change"
            else
              git commit -m "wind: refresh $(date -u '+%Y-%m-%d %H:%M UTC')"
              git pull --rebase --autostash || true
              git push || true
            fi
            sleep 420                        # 7 min — keeps rebuilds under the Pages limit
          done

      - name: Start the next run
        if: always()                        # runs even if the loop errored, so the chain never dies
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run baywinds.yml -R "$GITHUB_REPOSITORY" || true
